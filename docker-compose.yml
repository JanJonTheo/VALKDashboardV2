services:
  dashboard:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://valk:${AUTH_DB_PASSWORD}@auth-db:5432/valk_auth
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [valk]

  auth-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: valk
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: valk_auth
    volumes:
      - valk-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valk -d valk_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [valk]

volumes:
  valk-auth-data:

networks:
  valk:
    name: valk-services
